          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Create or update snapshot schedule for an instance
      description: |
        Scheduled runs automatically choose snapshot behavior from current instance state:
        - `Running` or `Standby` source: create a `Standby` snapshot.
        - `Stopped` source: create a `Stopped` snapshot.
        For running instances, this includes a brief pause/resume cycle during each capture.
        The minimum supported interval is `1m`, but larger intervals are recommended for
        heavier or latency-sensitive workloads.
        Updating only retention, metadata, or `name_prefix` preserves the next scheduled
        run; changing `interval` establishes a new cadence.
      operationId: setInstanceSnapshotSchedule
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Source instance ID or name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSnapshotScheduleRequest"
      responses:
        200:
          description: Snapshot schedule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotSchedule"
        400:
          description: Bad request - invalid schedule request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: Instance not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
