name: Test

on:
  push: {}
  pull_request: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      cli: ${{ steps.filter.outputs.cli }}
      sdk_go: ${{ steps.filter.outputs.sdk_go }}
      sdk_ts: ${{ steps.filter.outputs.sdk_ts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'cmd/**'
              - 'lib/**'
              - 'integration/**'
              - 'scripts/**'
              - 'openapi.yaml'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - '.github/workflows/test.yml'
              - '!apps/cli/**'
              - '!sdks/**'
            cli:
              - 'apps/cli/**'
              - 'sdks/go/**'
              - 'openapi.yaml'
              - 'stainless.yaml'
              - 'go.work'
              - '.github/workflows/stainless-sdks.yml'
              - '.github/workflows/test.yml'
            sdk_go:
              - 'sdks/go/**'
              - 'openapi.yaml'
              - 'stainless.yaml'
              - '.github/workflows/stainless-sdks.yml'
              - '.github/workflows/test.yml'
            sdk_ts:
              - 'sdks/ts/**'
              - 'openapi.yaml'
              - 'stainless.yaml'
              - '.github/workflows/stainless-sdks.yml'
              - '.github/workflows/test.yml'

  test:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: [self-hosted, linux, x64, kvm]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          cache: false
          go-version: '1.25.4'

      - name: Install dependencies
        run: |
          set -xe
          apt_retry() {
            local attempts=0
            until sudo "$@"; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 10 ]; then
                return 1
              fi
              sleep 10
            done
          }
          if ! command -v mkfs.erofs &> /dev/null || \
             ! command -v mkfs.ext4 &> /dev/null || \
             ! command -v iptables &> /dev/null; then
            apt_retry apt-get update
            apt_retry apt-get install -y erofs-utils e2fsprogs iptables
          fi
          go mod download

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Clean cached binaries
        run: make clean

      - name: Generate OpenAPI code
        run: make oapi-generate

      - name: Build
        run: make build

      - name: Check gofmt
        run: |
          set -euo pipefail
          go_files="$(git ls-files '*.go' | grep -Ev '^(apps/cli|sdks/)' || true)"
          if [ -z "$go_files" ]; then
            exit 0
          fi
          unformatted="$(echo "$go_files" | xargs gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run tests
        env:
          DOCKER_CONFIG: /home/debianuser/.docker
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          ACME_DNS_PROVIDER: "cloudflare"
          ACME_CA: "https://acme-staging-v02.api.letsencrypt.org/directory"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TLS_TEST_DOMAIN: "test.hypeman-development.com"
          TLS_ALLOWED_DOMAINS: '*.hypeman-development.com'
        run: make test

  test-darwin:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: [self-hosted, macos, arm64]
    concurrency:
      group: macos-ci-test-${{ github.ref }}
      cancel-in-progress: true
    env:
      DATA_DIR: /tmp/hypeman-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.4'
          cache: false
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Install dependencies
        run: |
          brew list e2fsprogs &>/dev/null || brew install e2fsprogs
          brew list erofs-utils &>/dev/null || brew install erofs-utils
          go mod download
      - name: Create run-scoped data directory
        run: mkdir -p "$DATA_DIR"
      - name: Generate OpenAPI code
        run: make oapi-generate
      - name: Build
        run: make build
      - name: Check gofmt
        run: |
          set -euo pipefail
          go_files="$(git ls-files '*.go' | grep -Ev '^(apps/cli|sdks/)' || true)"
          if [ -z "$go_files" ]; then
            exit 0
          fi
          unformatted="$(echo "$go_files" | xargs gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Run tests
        env:
          DEFAULT_HYPERVISOR: vz
          JWT_SECRET: ci-test-secret
        run: make test
      - name: Cleanup
        if: always()
        run: |
          pkill -f "vz-shim.*$DATA_DIR" || true
          rm -rf "$DATA_DIR"
          make clean

  e2e-install:
    needs: [changes, test-darwin]
    if: needs.changes.outputs.server == 'true'
    runs-on: [self-hosted, macos, arm64]
    concurrency:
      group: macos-ci-e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.4'
          cache: false
      - name: Install dependencies
        run: brew list caddy &>/dev/null || brew install caddy
      - name: Run E2E install test
        run: bash scripts/e2e-install-test.sh
      - name: Cleanup on failure
        if: failure()
        run: bash scripts/uninstall.sh || true

  test-cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          cache: true
          go-version: '1.25.4'
      - name: Run CLI tests
        env:
          GOWORK: ${{ github.workspace }}/go.work
        run: go test ./...
        working-directory: ./apps/cli

  test-sdk-go:
    needs: changes
    if: needs.changes.outputs.sdk_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          cache: true
          go-version: '1.25.4'
      - name: Run Go SDK tests
        run: GOWORK=off go test ./...
        working-directory: ./sdks/go

  test-sdk-ts:
    needs: changes
    if: needs.changes.outputs.sdk_ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.24.0'
      - name: Run TypeScript SDK tests
        run: |
          ./scripts/bootstrap
          ./scripts/test
        working-directory: ./sdks/ts
